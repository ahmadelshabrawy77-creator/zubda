<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17171A">
<title>زبدة</title>
</head>
<body>
<title>زبدة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a one-thumb phone column. A charcoal band carries Zubda the butter-yellow mascot and the month's profit; white cards
   sit on a warm paper ground; a big "what happened?" bar and four coloured quick buttons do most of the work. */
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#F3F0E8; --ink:#17171A; --muted:#6B675E; --line:#E8E3D6;
  --band:#17171A; --band2:#26252B; --on-band:#FFFFFF;
  --butter:#FFD23F; --butter2:#F5BE0B; --on-butter:#2B2100; --butter-soft:#FFF4CC;
  --green:#0F9D6B; --green-soft:#DDF5EC; --coral:#E5484D; --coral-soft:#FDE6E7;
  --sky:#2F6FEB; --sky-soft:#E3EDFE; --grape:#7457F2; --grape-soft:#ECE6FF;
  --pri:#17171A; --on-pri:#FFFFFF; --acc:#B7860B; --dr:#2F6FEB; --cr:#C2552E;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:20px; --r-sm:14px; --shadow:0 12px 30px rgba(23,23,26,.08); --pop:0 2px 0 rgba(23,23,26,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111113; --surface:#1B1B1F; --surface2:#242429; --ink:#F5F3EE; --muted:#A9A59B; --line:#2E2D33;
  --band:#0B0B0D; --band2:#1E1E23; --on-band:#FFFFFF;
  --butter:#FFD23F; --butter2:#F5BE0B; --on-butter:#2B2100; --butter-soft:#332B12;
  --green:#3DD598; --green-soft:#12352A; --coral:#FF7A7E; --coral-soft:#3B1C22;
  --sky:#7FB0FF; --sky-soft:#1A2943; --grape:#A690FF; --grape-soft:#2A2246;
  --pri:#FFD23F; --on-pri:#2B2100; --acc:#FFD23F; --dr:#7FB0FF; --cr:#F0A07A; --shadow:0 12px 30px rgba(0,0,0,.45); --pop:0 2px 0 rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1B1B1F; --surface2:#242429; --ink:#F5F3EE; --muted:#A9A59B; --line:#2E2D33;
  --band:#0B0B0D; --band2:#1E1E23; --on-band:#FFFFFF;
  --butter:#FFD23F; --butter2:#F5BE0B; --on-butter:#2B2100; --butter-soft:#332B12;
  --green:#3DD598; --green-soft:#12352A; --coral:#FF7A7E; --coral-soft:#3B1C22;
  --sky:#7FB0FF; --sky-soft:#1A2943; --grape:#A690FF; --grape-soft:#2A2246;
  --pri:#FFD23F; --on-pri:#2B2100; --acc:#FFD23F; --dr:#7FB0FF; --cr:#F0A07A; --shadow:0 12px 30px rgba(0,0,0,.45); --pop:0 2px 0 rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
body.ob::before{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{cursor:default}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance;font-weight:700}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-family:var(--f-display)}
.cur{font-size:.7em;font-weight:600;opacity:.75}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.ob #app{padding-bottom:0}

/* mascot */
.masc{display:block;overflow:visible;flex:none}
.masc .mb{fill:#FFD23F;stroke:#3A2A00;stroke-width:3.2;stroke-linejoin:round}
.masc .md{fill:#3A2A00} .masc .ms{fill:none;stroke:#3A2A00;stroke-width:3.2;stroke-linecap:round}
.masc .mh{fill:none;stroke:#FFFFFF;stroke-opacity:.8;stroke-width:5;stroke-linecap:round}
.masc .mc{fill:#FF8A7A;opacity:.55} .masc .msh{fill:#000000;opacity:.12} .masc .mw{fill:#FFFFFF} .masc .mt{fill:#5AA7FF} .masc .mx{fill:#FFB800}
.masc .mz{fill:#3A2A00;font:800 16px var(--f-display)}
.bob{animation:bob 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.wig{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.say{display:flex;gap:10px;align-items:flex-end}
.mbtn{background:none;border:none;padding:0;flex:none;border-radius:20px}
.bubble{position:relative;background:var(--surface);color:var(--ink);border-radius:18px 18px 6px 18px;padding:9px 13px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(60,45,0,.10);flex:1;min-width:0;line-height:1.55}

/* band */
.band{background-color:var(--band);color:var(--on-band);border-radius:0 0 34px 34px;padding-block:12px 56px;position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 94% 6%,rgba(255,255,255,.4) 0 48px,transparent 49px),radial-gradient(circle at 4% 92%,var(--band2) 0 74px,transparent 75px),radial-gradient(circle at 60% 125%,rgba(255,255,255,.25) 0 95px,transparent 96px)}
.band.slim{padding-block:12px 46px}
.band .top{display:flex;align-items:center;gap:8px}
.mark{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.5);display:grid;place-items:center;flex:none}
.who{flex:1;min-width:0}
.who b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11.5px;opacity:.75}
.iconbtn{width:38px;height:38px;border-radius:13px;border:none;background:rgba(255,255,255,.5);color:inherit;display:grid;place-items:center;flex:none}
.lvchip{display:inline-flex;gap:4px;align-items:center;border:none;background:rgba(255,255,255,.55);color:inherit;border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;white-space:nowrap}
.lvchip svg.i{width:15px;height:15px;color:#E09B00}
:root[data-theme="dark"] .iconbtn,:root[data-theme="dark"] .lvchip,:root[data-theme="dark"] .mark{background:rgba(255,255,255,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .iconbtn,:root:not([data-theme="light"]) .lvchip,:root:not([data-theme="light"]) .mark{background:rgba(255,255,255,.08)}}
.band .say{margin-top:12px}
.hero{margin-top:12px;display:grid;gap:2px}
.mnav{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.mnav button{width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.45);color:inherit;display:grid;place-items:center}
.mnav button[disabled]{opacity:.3}
.mnav button svg.i{width:15px;height:15px}
.mnav span{min-width:96px;text-align:center}
.herob{display:grid;gap:0;text-align:right;background:none;border:none;color:inherit;padding:0;width:100%}
.herob .lbl{font-size:13.5px;font-weight:600;opacity:.8}
.herob .big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1.1}
.herob .big .cur{font-size:17px}
.herob .sub{font-size:12.5px;opacity:.78}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.55);white-space:nowrap}
.pill.up{background:var(--green-soft);color:var(--green)} .pill.down{background:var(--coral-soft);color:var(--coral)}
.more{font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:2px;text-decoration:underline;text-underline-offset:3px}
.more svg.i{width:15px;height:15px}
.btitle{font-family:var(--f-display);font-size:26px;font-weight:800;margin-top:10px;line-height:1.2}
.bsub{font-size:13px;opacity:.8}

main.view{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:-36px;position:relative;z-index:2}
main.view>*{animation:up .4s cubic-bezier(.2,.8,.2,1) both}
main.view>*:nth-child(2){animation-delay:.04s}main.view>*:nth-child(3){animation-delay:.08s}main.view>*:nth-child(4){animation-delay:.12s}
@keyframes up{from{transform:translateY(10px)}to{transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;min-width:0;box-shadow:0 2px 0 rgba(60,45,0,.05)}
.card h2{font-size:18px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--sky);font-weight:700;font-size:13px;padding:0;display:inline-flex;align-items:center;gap:3px}
.link svg.i{width:15px;height:15px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* what happened bar + quick actions */
.whatbar{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--butter);background:var(--surface2);border-radius:18px;padding:12px 14px;text-align:right;color:var(--muted);font-weight:600;font-size:15px}
.whatbar span:first-child{flex:1}
.wmic{width:36px;height:36px;border-radius:12px;background:var(--butter);color:var(--on-butter);display:grid;place-items:center;flex:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.qa button{border:none;background:none;display:grid;justify-items:center;gap:5px;font-size:13px;font-weight:700;padding:2px 0;border-radius:16px}
.qa .ic{width:54px;height:54px;border-radius:18px;box-shadow:var(--pop)}
.qa .ic svg.i{width:24px;height:24px}
.qa button:active .ic{transform:translateY(2px);box-shadow:none}

/* money tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface2);border-radius:var(--r-sm);padding:9px 12px;display:grid;gap:0;min-width:0}
.tile .tl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:600}
.tile .tl svg.i{width:15px;height:15px}
.tile b{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display)}
.tile.warn{background:var(--sky-soft)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.split button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;text-align:right;display:grid;gap:0}
.split span{font-size:12px;color:var(--muted);font-weight:600}
.split b{font-size:17px;font-weight:700;font-family:var(--f-display)}

/* rows */
.rows{display:grid;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:11px;align-items:center;padding:10px 0;border:none;border-top:1px solid var(--line);width:100%;min-width:0;text-align:right;background:none}
.row:first-child{border-top:none}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.ic.in,.ic.g{background:var(--green-soft);color:var(--green)} .ic.out,.ic.c{background:var(--coral-soft);color:var(--coral)}
.ic.br,.ic.s{background:var(--sky-soft);color:var(--sky)} .ic.bt,.ic.y{background:var(--butter-soft);color:#B07800} .ic.p{background:var(--grape-soft);color:var(--grape)}
:root[data-theme="dark"] .ic.bt,:root[data-theme="dark"] .ic.y{color:var(--butter)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ic.bt,:root:not([data-theme="light"]) .ic.y{color:var(--butter)}}
.row .body{flex:1;min-width:0}
.row .ttl{display:block;font-weight:700;font-size:14.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .amt{font-weight:700;white-space:nowrap;font-size:16px;display:grid;justify-items:end;gap:0;font-family:var(--f-display)}
.row .amt small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.amt.in,.c-in{color:var(--green)} .amt.out,.c-out{color:var(--coral)} .amt.mid{color:var(--ink)}
.dayh{font-size:12px;color:var(--muted);font-weight:700;padding:12px 2px 2px}
.tag{font-size:11px;border-radius:999px;padding:1px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-weight:700}
.tag.good{background:var(--green-soft);color:var(--green)} .tag.bad{background:var(--coral-soft);color:var(--coral)} .tag.warn{background:var(--butter-soft);color:#A06C00}
:root[data-theme="dark"] .tag.warn{color:var(--butter)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.warn{color:var(--butter)}}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--pri);color:var(--on-pri);border-color:transparent;box-shadow:var(--pop)}
.btn.yel{background:var(--butter);color:var(--on-butter);border-color:transparent;box-shadow:0 4px 0 var(--butter2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--coral)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%}
.btn.big{padding:14px 16px;font-size:16.5px;border-radius:16px}
.btn[disabled]{opacity:.4;box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;text-align:right}
.chip.on{background:var(--pri);color:var(--on-pri);border-color:transparent}
.chip.ex{background:var(--surface2);border-color:transparent;white-space:normal;font-weight:500}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:7px 10px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.field{display:grid;gap:5px;min-width:0}
.field>label,.flabel{font-size:12.5px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea,.inp{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface);width:100%;min-width:0}
.field input:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--sky)}
.field.need input,.field.need select{border-color:var(--butter2);background:var(--butter-soft)}
.field.need>label,.field.need .flabel{color:#A06C00}
:root[data-theme="dark"] .field.need>label,:root[data-theme="dark"] .field.need .flabel{color:var(--butter)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .field.need>label,:root:not([data-theme="light"]) .field.need .flabel{color:var(--butter)}}
.bigin{font-family:var(--f-display);font-size:26px!important;font-weight:700;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 12px}
.search svg.i{color:var(--muted);width:18px;height:18px}
.search input{border:none;background:transparent;flex:1;padding:10px 0;min-width:0;outline:none}
.switch{width:48px;height:28px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:all .2s}
.switch[aria-checked="true"]{background:var(--green);border-color:transparent}
.switch[aria-checked="true"]::after{inset-inline-start:23px;background:#FFFFFF}
.swrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.swrow b{font-size:14px;display:block}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:12px;padding:3px}
.stepper button{width:32px;height:32px;border:none;border-radius:10px;background:var(--surface);font-weight:800;font-size:18px;line-height:1}
.stepper b{min-width:30px;text-align:center}

/* alerts */
.al{display:flex;gap:11px;align-items:center;padding:10px 0;border:none;border-top:1px solid var(--line);width:100%;background:none;text-align:right}
.al:first-of-type{border-top:none}
.al .ic{width:36px;height:36px;border-radius:12px}
.al p{margin:0;font-size:13.5px;flex:1;font-weight:500}
.al .go{color:var(--muted);flex:none}

/* fun corner */
.fun{background:linear-gradient(165deg,var(--grape-soft),var(--surface) 62%);display:grid;gap:12px}
.fun .sec{margin-bottom:0}
.lvl{display:flex;gap:12px;align-items:center}
.lvbadge{width:54px;height:54px;border-radius:18px;background:var(--grape);color:#FFFFFF;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;box-shadow:0 3px 0 rgba(60,30,160,.35);flex:none}
.lvl b{font-size:15px}
.bar{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--grape),var(--sky));transition:width .8s}
.streak{display:flex;gap:7px;align-items:center;flex:none;text-align:center}
.streak b{font-size:22px;font-family:var(--f-display);line-height:1}
.streak small{font-size:11px}
.chal{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:1.5px dashed var(--grape);background:var(--surface);border-radius:16px;padding:10px 12px}
.chal.done{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.chal small{font-size:11.5px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.games button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;display:grid;justify-items:center;gap:5px;font-weight:700;font-size:12.5px;box-shadow:var(--pop)}
.games button:active{transform:translateY(2px);box-shadow:none}
.games .ic{width:40px;height:40px;border-radius:13px}
.games .tag{font-size:10px;padding:0 7px}

/* quiz / guess / badges */
.qtext{font-size:20px;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:right;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 15px;font-weight:700;font-size:15px;box-shadow:var(--pop)}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);color:var(--coral)}
.opt[disabled]{box-shadow:none}
input[type=range]{width:100%;accent-color:var(--grape);height:28px}
.guessv{font-family:var(--f-display);font-size:40px;font-weight:800;text-align:center;line-height:1.2}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{display:grid;justify-items:center;gap:3px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 6px}
.bdg .ic{width:48px;height:48px;border-radius:50%;background:var(--butter);color:var(--on-butter);box-shadow:var(--pop)}
.bdg.off .ic{background:var(--surface2);color:var(--muted);box-shadow:none}
.bdg.off b{color:var(--muted)}

/* quick sale / expense */

/* ask */

/* bars */
.bars{display:grid;gap:9px}

.track i.y{background:var(--green)}

/* kv & statements */
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}

/* dock */
nav.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}

nav.dock button.fab{width:60px;height:60px;margin:-30px auto 0;border-radius:22px;background:var(--butter);color:var(--on-butter);box-shadow:0 5px 0 var(--butter2),0 10px 22px rgba(160,120,0,.3);display:grid;place-items:center}

nav.dock button.fab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--butter2)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(30,25,5,.5);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;max-width:520px;margin:0 auto;
  padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr);gap:12px;grid-auto-rows:max-content;animation:rise .28s cubic-bezier(.2,.8,.2,1)}

/* record & review */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eff .e.warn{color:var(--butter)}}

/* one mic per form, grouped business kinds, form sections */
.vbox{display:grid;gap:8px;min-width:0}
.vbar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--butter-soft),var(--surface));border:1.5px solid var(--butter2);border-radius:20px;padding:10px;box-shadow:var(--pop);min-width:0}
.vmic{flex:none;width:52px;height:52px;border-radius:50%;border:none;background:var(--butter);color:var(--on-butter);display:grid;place-items:center;box-shadow:0 3px 0 rgba(60,45,0,.2)}
.vmic svg.i{width:24px;height:24px}
.vmic.on{background:var(--coral);color:#FFFFFF;animation:recp 1s infinite}
.vmid{flex:1;min-width:0;display:grid;gap:1px}
.vmid b{font-size:13.5px}
.vin{border:none!important;background:transparent!important;padding:4px 0!important;min-width:0;width:100%;font-size:14px;outline:none;color:var(--ink);box-shadow:none!important}
.vin::placeholder{color:var(--muted);font-size:12px}
.vbar .btn{flex:none}
.vconf{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;animation:fade .2s}
.vconf p{margin:0}
.vch{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px}
.vch svg.i{color:#E09B00;flex:none}
.vrows{display:grid;gap:6px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.1fr) auto;gap:6px;align-items:center;background:var(--surface2);border-radius:12px;padding:6px 8px}
.vrow .vval{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .varr{color:var(--muted);display:grid}
.vrow .varr svg.i{width:14px;height:14px}
.vrow select{min-width:0;width:100%;padding:6px 8px;font-size:13px}
.vrow .x{width:30px;height:30px}
.vrow.bad{outline:1.5px dashed var(--coral)}
.vrow small{grid-column:1/-1;color:var(--coral);font-size:11.5px}
@keyframes vhit{0%{box-shadow:0 0 0 0 rgba(255,194,26,.8);background:var(--butter-soft)}100%{box-shadow:0 0 0 12px rgba(255,194,26,0)}}
.vhit{animation:vhit 1.5s ease-out;border-radius:12px}
.fsec{display:grid;gap:12px;min-width:0}
.fsh{display:flex;gap:10px;align-items:flex-start}
.fsh h2{font-size:16.5px;margin:0}
.fsh .hint{margin-top:2px}
.fsb{display:grid;gap:10px;min-width:0}
.field>label svg.i{width:14px;height:14px;vertical-align:-2px}
.fhero{display:flex;gap:12px;align-items:center;background:var(--band);color:var(--on-band);border-radius:20px;padding:12px 14px;min-width:0}
.fhero b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhero span{font-size:12.5px;opacity:.85}
.tpick{display:grid;gap:12px}
.tgn{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
.tgl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 10px;display:flex;gap:8px;align-items:center;text-align:right;font-weight:700;font-size:13px;min-width:0;color:var(--ink)}
.tbtn span{line-height:1.3;min-width:0;overflow-wrap:anywhere}
.tbtn svg.i{flex:none;width:18px;height:18px;color:var(--muted)}
.tbtn.on,.seg3 button.on{border-color:var(--green);background:var(--green-soft)}
.tbtn.on svg.i,.seg3 button.on svg.i{color:var(--green)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.seg3 button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:grid;justify-items:center;gap:3px;text-align:center;min-width:0;color:var(--ink)}
.seg3 b{font-size:13px}
.seg3 small{font-size:10.5px;color:var(--muted);line-height:1.3}
.seg3 svg.i{width:20px;height:20px;color:var(--muted)}
.tdet{border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.tdet summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap}
.tdet summary::-webkit-details-marker{display:none}
.tdet .flabel{width:100%}
.tdet .tcur{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.tdet .tcur svg.i{width:18px;height:18px;color:var(--green)}
.tdet[open] summary{margin-bottom:10px}
.tdet[open] .link{display:none}
body.vopen .savebar{display:none}
.dzone{border:1.5px dashed var(--coral);border-radius:16px;padding:10px 12px}
.dzone summary{cursor:pointer;font-weight:700;color:var(--coral);display:flex;gap:6px;align-items:center}
.dzone[open] summary{margin-bottom:10px}
/* live scene */
.sctl{display:flex;gap:6px;align-items:center}
.x.sm{width:32px;height:32px}
.seg2{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg2 button{border:none;background:transparent;border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scene .tap{cursor:pointer}
.scene .wk{animation:wk .42s ease-in-out infinite alternate}
@keyframes wk{from{transform:translateY(0)}to{transform:translateY(-1.3px)}}
.scene .glow{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.12}to{opacity:.5}}
.scene .blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.scene .belt{animation:belt 2.4s linear infinite}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(-22px)}}
.goalbar{display:grid;gap:6px;width:100%;border:none;background:var(--surface2);border-radius:14px;padding:10px 12px;text-align:right;color:var(--ink)}
.gtxt{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.gtxt span{color:var(--muted);font-size:12.5px}
.gtrack{height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:block}
.gtrack i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FFC21A,#FFD23F);transition:width .6s}
.goalbar.done .gtrack i{background:linear-gradient(90deg,#12945F,#4BD293)}
.ticker{display:grid;gap:2px}
.ticker button{display:flex;gap:8px;align-items:center;border:none;background:transparent;padding:4px 2px;text-align:right;font-size:12.5px;color:var(--muted);min-width:0}
.ticker button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticker svg.i{width:15px;height:15px;flex:none;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.scene .wk,.scene .glow,.scene .blink,.scene .belt,.vhit{animation:none}}
@media (max-width:360px){.tgl{grid-template-columns:1fr}.seg3 small{display:none}}
/* deep band: translucent controls tuned for a dark header */
.band{background-image:radial-gradient(circle at 94% 6%,rgba(255,255,255,.07) 0 48px,transparent 49px),radial-gradient(circle at 4% 92%,var(--band2) 0 74px,transparent 75px),radial-gradient(circle at 60% 125%,rgba(255,210,63,.14) 0 95px,transparent 96px)}
.mark,.iconbtn,.lvchip,.mnav button{background:rgba(255,255,255,.12)!important}
.pill{background:rgba(255,255,255,.14)}
.band .pill.up{background:rgba(63,203,142,.18);color:#7BE3B3}.band .pill.down{background:rgba(255,107,94,.18);color:#FF9C90}
.herob .big{color:#FFFFFF}
/* screenshot button in the one-mic bar */
.vcam{flex:none;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.vcam svg.i{width:19px;height:19px}
/* several items in one entry */
.basket{display:grid;gap:8px;border:1.5px solid var(--line);border-radius:16px;padding:10px;background:var(--surface)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bh b{display:flex;gap:6px;align-items:center;font-size:14px}
.bline{display:grid;gap:6px;background:var(--surface2);border-radius:12px;padding:8px}
.bline.need{outline:1.5px dashed var(--butter2)}
.bl1{display:flex;gap:6px;align-items:center}
.bl1 select{flex:1;min-width:0}
.bl2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);gap:6px;align-items:center}
.bl2 select{min-width:0;width:auto;max-width:110px}
.bl2 .unit{font-size:13px;color:var(--muted);padding-inline:4px}
.bline .x{width:32px;height:32px}
.btot{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid var(--line);padding-top:8px;font-weight:700}
.btot b{font-size:18px}
.addln{margin-top:2px}
.saybar.solo{margin-top:0;background:var(--surface);border:1.5px solid var(--line)}
/* بورصة زبدة: a trading-terminal card */
.mkt{background:linear-gradient(165deg,#17171A,#232227 60%,#17171A);color:#F5F3EE;border:1px solid #34333A;position:relative;overflow:hidden;display:grid;gap:8px}
.mkt .hint,.mksub{color:#B5B1A6;font-size:12px}
.mkh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mkid{display:flex;align-items:center;gap:8px;min-width:0}
.mkid b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkcode{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:800;letter-spacing:.06em;background:#FFD23F;color:#231B00;border-radius:6px;padding:1px 7px;direction:ltr}
.mkctl{display:flex;align-items:center;gap:6px}
.mkstat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#B5B1A6;font-weight:600}
.mkstat i{width:7px;height:7px;border-radius:50%;background:#6B7F78}
.mkstat.on i{background:#2BD38A;animation:mkblink 1.6s ease-in-out infinite}
@keyframes mkblink{50%{opacity:.25}}
.mkbtn{width:30px;height:30px;border-radius:9px;border:1px solid #45434B;background:transparent;color:#E8E6E0;display:grid;place-items:center}
.mkbtn svg.i{width:16px;height:16px}
.mkp{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:none;border:none;color:inherit;padding:0;text-align:right;border-radius:10px}
.mkv{font-size:38px;font-weight:800;line-height:1.05;color:#FFFFFF}
.mkcur{font-size:13px;color:#B5B1A6}
.mkchg{font-family:var(--f-display);font-weight:800;font-size:13px;border-radius:7px;padding:1px 8px;white-space:nowrap;direction:ltr}
.mkchg.up{background:rgba(43,211,138,.16);color:#2BD38A}.mkchg.dn{background:rgba(255,107,94,.16);color:#FF6B5E}.mkchg.flat{background:rgba(143,179,166,.16);color:#B5B1A6}
.mkp.flash{animation:mkflash 1s ease-out}
@keyframes mkflash{0%{background:rgba(43,211,138,.35)}100%{background:transparent}}
.mkchart svg,.mkc{display:block;width:100%;height:auto}
.mkpulse{animation:mkpulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mkpulse{0%{opacity:1}70%{opacity:.35}100%{opacity:1}}
.mkgoal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:#B5B1A6}
.mkgoal b{color:#FFD23F;font-family:var(--f-display)}
.mktrack{height:6px;border-radius:9px;background:#2B2A30;overflow:hidden;display:block}
.mktrack i{display:block;height:100%;background:linear-gradient(90deg,#F5BE0B,#FFD23F);border-radius:9px}
.mktape{overflow:hidden;border-top:1px solid #34333A;border-bottom:1px solid #34333A;margin-inline:-18px;padding:6px 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mktape-in{display:inline-flex;gap:22px;white-space:nowrap;animation:mktape 26s linear infinite;padding-inline:18px;font-size:12.5px}
.mktape-in span{display:inline-flex;gap:6px;align-items:center}
.mktape-in .up{color:#2BD38A}.mktape-in .dn{color:#FF6B5E}.mktape-in .flat{color:#B5B1A6}
.mktape-in b{color:#F5F3EE;font-weight:600}
@keyframes mktape{from{transform:translateX(0)}to{transform:translateX(50%)}}
.mkfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mkfoot button,.mkwide{display:flex;gap:6px;align-items:center;justify-content:center;border:1px solid #45434B;background:rgba(255,255,255,.04);color:#F5F3EE;border-radius:12px;padding:9px;font-weight:700;font-size:13px}
.mkfoot svg.i,.mkwide svg.i{width:16px;height:16px;color:#FFD23F}
.mkban{position:absolute;inset:0 0 auto;z-index:2;transform:translateY(-110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:#FFD23F;color:#231B00;font-weight:800;font-size:13.5px;padding:10px 14px;display:flex;gap:8px;align-items:center}
.mkban.on{transform:none}.mkban.goal{background:#2BD38A;color:#062218}.mkban svg.i{width:18px;height:18px}
.mkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mkgrid div{background:rgba(255,255,255,.04);border:1px solid #34333A;border-radius:10px;padding:6px 8px;min-width:0}
.mkgrid small{display:block;font-size:11px;color:#B5B1A6}
.mkgrid b{font-size:14px;color:#FFFFFF;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg2.dk{background:rgba(255,255,255,.06);justify-self:start}
.seg2.dk button{color:#B5B1A6}.seg2.dk button.on{background:#FFD23F;color:#231B00}
.wl{display:grid}
.wlr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px;align-items:center;border:none;border-top:1px solid #34333A;background:none;color:inherit;padding:9px 2px;text-align:right}
.wlr:first-child{border-top:none}.wlr.cur .wln{color:#FFD23F}
.wln{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wlv{font-weight:800;font-size:13.5px}
.heatkey{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#B5B1A6}
.heatkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.mkt .tap{cursor:pointer}
.mvs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mvs small{color:#B5B1A6;font-size:11.5px;display:block;margin-bottom:4px}
.mvr{display:flex;justify-content:space-between;gap:6px;align-items:center;width:100%;border:none;background:none;color:inherit;padding:5px 0;text-align:right;font-size:13px}
.mvr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news{display:flex;gap:10px;align-items:flex-start;width:100%;border:none;border-top:1px solid var(--line);background:none;padding:10px 0;text-align:right;color:var(--ink)}
.news:first-of-type{border-top:none}
.news span{display:grid;gap:1px;min-width:0}.news b{font-size:14px}.news small{color:var(--muted);font-size:12.5px;line-height:1.5}
.spark.wide{width:100%;height:60px}
.mkt.demo{margin-top:6px}
@media (max-width:360px){.mkgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mvs{grid-template-columns:1fr}.mkv{font-size:32px}}
@media (prefers-reduced-motion: reduce){.mktape-in,.mkstat.on i,.mkpulse,.mkp.flash{animation:none}}
/* زبدة يسولف: chat companion */
.zc{display:grid;gap:10px}
.zh{display:flex;align-items:center;gap:10px}
.zt{flex:1;min-width:0;display:grid}
.zt b{font-family:var(--f-display);font-size:18px;line-height:1.2}
.zt small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.zt small i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.zthread{display:grid;gap:8px;max-height:340px;overflow-y:auto;padding:10px 6px;background:var(--surface2);border-radius:16px;overscroll-behavior:contain;scroll-behavior:smooth}
.zthread.full{max-height:none}
.zm{display:grid;gap:6px;max-width:86%;animation:zin .25s ease-out}
.zm.z{justify-self:start}.zm.me{justify-self:end}
.zm.pend{display:none}
.zb{padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.zm.z .zb{background:var(--surface);color:var(--ink);border-start-start-radius:5px;box-shadow:0 1px 2px rgba(14,59,51,.08)}
.zm.me .zb{background:var(--band);color:var(--on-band);border-start-end-radius:5px}
.zacts{display:flex;gap:6px;flex-wrap:wrap}
.zact{border:1.5px solid var(--butter2);background:var(--butter-soft);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.typing .zb{display:flex;gap:4px;align-items:center;padding:12px 14px}
.typing .zb i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:zdot 1s infinite}
.typing .zb i:nth-child(2){animation-delay:.15s}.typing .zb i:nth-child(3){animation-delay:.3s}
@keyframes zdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes zin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.zchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.zchips::-webkit-scrollbar{display:none}
.zchips .chip{flex:none}
.zin{display:flex;gap:8px;align-items:center}
.zin .inwrap{flex:1}
.zin input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;font-size:14.5px;min-width:0}
.zsend{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:var(--pri);color:var(--on-pri);display:grid;place-items:center}
@media (prefers-reduced-motion: reduce){.zm,.typing .zb i{animation:none}}
/* invoice-style entry */
.bcols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:6px;font-size:11.5px;color:var(--muted);padding-inline:8px}
.bl1 .bn{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.bwarn{color:#B7791F}
.baddl{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;border:1.5px dashed var(--butter2);background:var(--butter-soft);color:var(--ink);border-radius:12px;padding:10px;font-weight:700}
.bsum{display:grid;gap:6px;border-top:1.5px solid var(--line);padding-top:8px}
.bsum>div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.bsum .bdisc input{max-width:120px;text-align:left;padding:6px 10px}
.bsum .btot{border-top:none;padding-top:2px;font-size:15px}
.basket .btot b{font-size:20px;color:var(--ink)}
/* payment methods */
.paygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.paybtn{display:grid;justify-items:center;gap:4px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 4px;text-align:center;min-width:0}
.paybtn svg.i{width:22px;height:22px;color:var(--muted)}
.paybtn b{font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.paybtn.on{border-color:var(--pri);background:var(--butter-soft);box-shadow:inset 0 0 0 1px var(--pri)}
.paybtn.on svg.i{color:var(--ink)}
.paybtn.cr.on{border-color:#B7791F;background:var(--butter-soft);box-shadow:inset 0 0 0 1px #B7791F}.paybtn.cr.on svg.i{color:#B7791F}
.psplit{display:grid;gap:6px;margin-top:8px;background:var(--surface2);border-radius:14px;padding:10px}
.sprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.spsum{font-size:13px}.spsum svg.i{width:15px;height:15px;color:var(--green);vertical-align:-2px}
.caps{display:grid;gap:10px}
/* invoice document */
.invdoc{background:#FFFFFF;color:#17142B;border-radius:16px;border:1px solid var(--line);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.ivh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:3px solid #FFD23F;padding-bottom:10px}
.ivh b{font-family:var(--f-display);font-size:18px;display:block}
.ivh small,.ivc small{display:block;font-size:11.5px;color:#6B6785}
.ivno{text-align:left;display:grid;justify-items:end}.ivno span{font-size:12px;color:#8A6400;font-weight:700}.ivno b{font-size:18px}
.ivc{display:grid;gap:1px}.ivc span{font-size:11.5px;color:#6B6785}
.ivt{width:100%;border-collapse:collapse;font-size:13px}
.ivt th{background:#F0EEF8;color:#4B4766;font-weight:700;padding:6px;text-align:right}
.ivt td{padding:7px 6px;border-bottom:1px solid #EEECF5}
.ivs{display:grid;gap:4px;font-size:13.5px}.ivs>div{display:flex;justify-content:space-between;gap:8px}

/* ================================================================ ledger engine
   Transactions are the facts; the journal, stock and every balance are rebuilt from them in date order.
   Editing or deleting an old entry therefore re-flows cost of goods, production cost and stock correctly. */

function touch(){VER++;LED=null}
const vatOn=()=>!!(S&&S.biz.vat&&VAT>0);

function journal(t,st){
  const A_=r2(t.amount),L=[],info={};

  switch(t.kind){
    case "sale":
      L.push([payAcc(t.pay,"in"),A_,0],["4101",0,net]);if(vat)L.push(["2201",0,vat]);
      if(it&&q>0&&!isSvc(t.item)){const c=r2(q*it.avg);if(c)L.push(["5101",c,0],[accOf(t.item),0,c]);info.cogs=c;info.before=it.qty;it.qty=r2(it.qty-q);info.after=it.qty}
      info.net=net;info.vat=vat;break;
    case "ret":
      L.push(["4101",net,0]);if(vat)L.push(["2201",vat,0]);L.push([payAcc(t.pay,"in"),0,A_]);
      if(it&&q>0&&!isSvc(t.item)){const c=r2(q*it.avg);if(c)L.push([accOf(t.item),c,0],["5101",0,c]);info.cogs=c;info.before=it.qty;it.qty=r2(it.qty+q);info.after=it.qty}
      info.net=net;info.vat=vat;break;
    case "purchase":
      if(it&&q>0){L.push([accOf(t.item),net,0]);info.before=it.qty;info.oldAvg=it.avg;const base=Math.max(it.qty,0);it.avg=(base*it.avg+net)/(base+q);it.qty=r2(it.qty+q);info.after=it.qty;info.unit=net/q;info.avg=it.avg}
      else L.push(["5399",net,0]);
      if(vat)L.push(["1401",vat,0]);L.push([payAcc(t.pay,"out"),0,A_]);info.vat=vat;info.net=net;break;
    case "produce":{
      const def=itemById(t.item);if(!it||!def||!(q>0))break;
      const parts=[],by={};let tot=0;
      (def.recipe||[]).forEach(([rid,per])=>{const r=st[rid];if(!r)return;const need=r2((+per||0)*q);const v=r2(need*r.avg);const before=r.qty;r.qty=r2(r.qty-need);tot=r2(tot+v);const a=accOf(rid);by[a]=r2((by[a]||0)+v);parts.push({id:rid,need,v,before,left:r.qty})});
      const extra=r2(A_||0),total=r2(tot+extra);

    case "expense":{const c=ACC[t.cat]&&t.cat[0]==="5"?t.cat:"5399";L.push([c,net,0]);if(vat)L.push(["1401",vat,0]);L.push([payAcc(t.pay,"out"),0,A_]);info.vat=vat;info.net=net;break}
    case "collect":L.push([payAcc(t.pay,"in"),A_,0],["1201",0,A_]);break;
    case "pay_supplier":L.push(["2101",A_,0],[payAcc(t.pay,"out"),0,A_]);break;
    case "transfer":{const f=r2(t.fee||0);L.push([(PAYS[t.to]||PAYS.bank).a,A_,0]);if(f)L.push(["5309",f,0]);L.push([(PAYS[t.from]||PAYS.platform).a,0,r2(A_+f)]);break}
    case "draw":L.push(["3201",A_,0],[payAcc(t.pay,"out"),0,A_]);break;
    case "capital":L.push([payAcc(t.pay,"in"),A_,0],["3101",0,A_]);break;
    case "income":L.push([payAcc(t.pay,"in"),A_,0],["4201",0,A_]);break;
    case "adjust":
      if(it){const d=r2(t.qty),v=r2(Math.abs(d)*it.avg),a=accOf(t.item);info.before=it.qty;it.qty=r2(it.qty+d);info.after=it.qty;info.value=v;

}

function sentence(t){

function shopData(){
  const t=today();const L=ledger();const rows=L.rows;const todays=rows.filter(r=>r.t.date===t&&r.t.kind==="sale");
  const sales=r2(todays.reduce((s,r)=>s+r.t.amount,0));
  const days=[];for(let i=1;i<=14;i++){const d=addDays(t,-i);days.push(rows.filter(r=>r.t.date===d&&r.t.kind==="sale").reduce((s,r)=>s+r.t.amount,0))}
  const act=days.filter(v=>v>0);const avg=act.length?act.reduce((a,b)=>a+b,0)/act.length:0;
  const vans=S.orders.filter(o=>o.date===t&&o.status!=="returned").length+todays.filter(r=>r.t.pay==="platform"&&!r.t.ord).length;
  const prod=rows.filter(r=>r.t.kind==="produce"&&daysBetween(r.t.date,t)<=6).reduce((s,r)=>s+(+r.t.qty||0),0);
  const sold=itemStats(r=>daysBetween(r.t.date,t)<=30);
  const shelf=S.items.filter(i=>i.kind==="goods"||i.kind==="made").sort((a,z)=>((sold[z.id]||{}).qty||0)-((sold[a.id]||{}).qty||0));
  const tanks=S.items.filter(i=>i.kind==="raw"||i.kind==="pack");
  return {sales,n:todays.length,avg,vans,prod,shelf,tanks,st:L.st,h:new Date().getHours(),factory:(BTYPES[S.biz.type]||{}).base==="factory",incense:S.items.some(i=>/(بخور|عود|معمول|دخون|عطر|مسك)/.test(i.name))};
}

function chartCard(m){

  const bars=vals.map((v,i)=>{const x=W-10-bw-i*(bw+gap);const val=v.p.net;const hgt=Math.max(2,Math.abs(val)*sc);const y=val>=0?zero-hgt:zero;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${hgt}" rx="8" class="${v.m===m?"bc":val<0?"bn":"bp"}"/><text x="${x+bw/2}" y="${val>=0?y-5:y+hgt+12}" text-anchor="middle" class="v">${Math.abs(val)>=1000?(Math.round(val/100)/10)+"k":Math.round(val)}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${mShort(v.m).slice(0,5)}</text>`}).join("");
  return `<section class="card"><div class="sec"><h2>صافي الربح آخر 6 شهور</h2></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="صافي الربح لآخر ستة أشهر"><line x1="6" x2="${W-6}" y1="${zero}" y2="${zero}" class="ax"/>${bars}</svg></section>`;
}

  const br=[["صافي الربح",P.net],["بضاعة وخامات اشتريتها ولسه ما انباعت",-(D("1301")+D("1302")+D("1303"))],["مبيعات آجلة لسه ما تحصّلت",-D("1201")],["مشتريات آجلة لسه ما سددتها",-D("2101")],["ضريبة استلمتها ولسه ما ورّدتها",-(D("2201")+D("1401"))],["سحوباتك الشخصية",-D("3201")],["فلوس حطيتها من جيبك",-D("3101")]].filter((x,i)=>i===0||Math.abs(x[1])>0.009);

    ${P.oth?`<div class="kv"><span>إيرادات أخرى</span><span>${money(P.oth)}</span></div>`:""}
    ${P.exps.map(x=>`<div class="kv sub"><span>${esc(x[1])}</span><span>${money(-x[2])}</span></div>`).join("")}
    <div class="kv tot"><span>صافي الربح${P.rev?` (${pctT(P.net/P.rev)})`:""}</span><span class="${P.net>=0?"c-in":"c-out"}">${money(P.net)}</span></div></div>`;

/* ================================================================ voice: the main entry box keeps its own mic; forms get one mic for the whole form (vbar) */
let REC=null;
function decorateMics(root){
  (root||document).querySelectorAll('.ask input,textarea.rin').forEach(inp=>{
    if(inp.closest(".inwrap")||inp.dataset.nomic!=null||inp.disabled)return;
    const w=document.createElement("span");w.className="inwrap"+(inp.classList.contains("rin")?" big":"");inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const b=document.createElement("button");b.type="button";b.className="micf";b.dataset.a="mic";b.setAttribute("aria-label","قلها بصوتك");b.innerHTML=svg("mic");w.appendChild(b);
  });
}
function micFallback(inp){if(inp){inp.focus();if(inp.setSelectionRange&&inp.type!=="number")try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}}toast("تكلّم من مايك الكيبورد: اضغط زر المايك في كيبورد جوالك")}
function startMic(inp,btn){
  if(!inp)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(REC){try{REC.stop()}catch(e){}REC=null;document.querySelectorAll(".micf.on").forEach(x=>x.classList.remove("on"));return}
  if(!SR){micFallback(inp);return}
  try{
    const r=new SR();r.lang=S&&S.biz.country==="EG"?"ar-EG":"ar-SA";r.interimResults=true;r.maxAlternatives=1;
    const base=inp.type==="number"||!inp.value?"":inp.value+" ";btn.classList.add("on");
    r.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
      if(inp.type==="number"){const n=extractNums(tokenize(t).norm)[0];if(n)inp.value=n.v}else inp.value=base+t;
      inp.dispatchEvent(new Event("input",{bubbles:true}))};
    r.onerror=e=>{btn.classList.remove("on");REC=null;micFallback(inp)};
    r.onend=()=>{btn.classList.remove("on");REC=null};
    r.start();REC=r;
  }catch(e){btn.classList.remove("on");micFallback(inp)}
}

function parseContact(text){
  const s=String(text||"").replace(/[٠-٩]/g,d=>AD.indexOf(d));const out={};const C=CTRY();
  const phs=s.match(/(\+|00)?\d[\d\s\-]{6,16}\d/g)||[];for(const p of phs){const ok=phoneOk(p);if(ok){out.phone=ok;break}}
  const iban=s.replace(/\s/g,"").match(/SA\d{22}/i);if(iban)out.iban=iban[0].toUpperCase();
  const vat=s.replace(/\s/g,"").match(/(?<!\d)3\d{13}3(?!\d)/);if(vat)out.vatNo=vat[0];
  const crs=s.match(/(?<!\d)\d{10}(?!\d)/g)||[];const cr=crs.find(x=>!out.phone||out.phone.indexOf(x.replace(/^0/,""))<0);if(cr)out.cr=cr;
  const nat=s.match(/(?:^|[^A-Za-z])([A-Za-z]{4}\s?\d{4})(?![\d])/);if(nat)out.nat=nat[1].replace(/\s/g,"").toUpperCase();
  const T=normW(s);const city=C.cities.find(c=>T.indexOf(normW(c))>=0);if(city)out.city=city;
  const dm=s.match(/حي\s+([^\s،,\d]+(?:\s(?!شارع|طريق|مدينة|جوال|رقم|ايبان|آيبان|سجل|الرقم|ضريبي|ملاحظة|ملاحظه)[^\s،,\d]+)?)/);if(dm)out.district=dm[1].trim();
  const sm=s.match(/((?:شارع|طريق)\s+[^،,\d]+?)(?=\s*(?:،|,|حي\s|مدينة|جوال|رقم|$|\d|[A-Za-z]))/);if(sm)out.street=sm[1].trim();
  const nm=s.match(/(?:اسمه|اسمها|الاسم|العميل|العميلة|المورد)\s*:?\s*([^\d،,]+?)(?=\s*(?:،|,|جوال|رقم|من\s|في\s|حي\s|مدينة|\d|$))/);

function hijri(d){try{const p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{month:"numeric",day:"numeric"}).formatToParts(d);return {m:+p.find(x=>x.type==="month").value,d:+p.find(x=>x.type==="day").value}}catch(e){return null}}
function seasonOn(d,c){const h=hijri(d);if(h){if(h.m===9)return {k:"ramadan",n:"رمضان كريم"};if(h.m===10&&h.d<=4)return {k:"eid",n:"عيد الفطر"};if(h.m===12&&h.d>=9&&h.d<=13)return {k:"eid",n:"عيد الأضحى"}}
  const md=iso(d).slice(5);if(c==="SA"&&md>="09-20"&&md<="09-25")return {k:"national",n:"اليوم الوطني"};if(c==="SA"&&md>="02-20"&&md<="02-23")return {k:"national",n:"يوم التأسيس"};if(c==="AE"&&md>="11-30"&&md<="12-03")return {k:"national",n:"عيد الاتحاد"};if(c==="KW"&&md>="02-24"&&md<="02-27")return {k:"national",n:"العيد الوطني"};if(c==="QA"&&md==="12-18")return {k:"national",n:"اليوم الوطني"};return null}

function custStats(){const by={};ledger().rows.forEach(r=>{const t=r.t;if(t.kind!=="sale"||!t.party)return;const k=normName(t.party);const x=by[k]||(by[k]={key:k,name:t.party,n:0,sum:0,last:t.date,first:t.date});x.n++;x.sum=r2(x.sum+(+t.amount||0));if(t.date>x.last)x.last=t.date;if(t.date<x.first)x.first=t.date});return by}
function segments(){const cs=Object.values(custStats());const t=today();const vipN=Math.max(1,Math.ceil(cs.length*.15));const vip=new Set(cs.slice().sort((a,z)=>z.sum-a.sum).slice(0,vipN).filter(x=>x.n>=2).map(x=>x.key));
  const seg={};cs.forEach(x=>{seg[x.key]=daysBetween(x.last,t)>45?"lost":vip.has(x.key)?"vip":daysBetween(x.first,t)<=30&&x.n<=1?"new":"regular"});return {cs,seg}}

  if(S.tx.length>20)S.items.filter(i=>(i.kind==="goods"||i.kind==="made")&&(L.st[i.id]||{}).qty>0&&!(s30[i.id]&&s30[i.id].qty>0)).forEach(i=>{const st=L.st[i.id];out.push({k:"slow",ic:"tag",c:"s",id:i.id,t:`${i.name} ما انباع هالشهر`,d:`عندك ${nf(st.qty)} ${i.unit}${can("money")?` بقيمة ${moneyT(st.qty*st.avg)}`:""}. سوّ منه باقة مع منتجك الأكثر مبيعًا.`})});

  return out;
}

}

function snd(k){

    const tone=(f,s,d,type,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t+s);g.gain.setValueAtTime(.0001,t+s);g.gain.exponentialRampToValueAtTime(vol||.1,t+s+.008);g.gain.exponentialRampToValueAtTime(.0001,t+s+d);o.connect(g);g.connect(AC.destination);o.start(t+s);o.stop(t+s+d+.05)};
    if(k==="sale"){tone(1320,0,.09,"sine",.07);tone(1760,.06,.16,"sine",.06)}
    else if(k==="bell"){[0,.32].forEach(s=>{tone(880,s,1.1,"sine",.09);tone(1320,s,.8,"sine",.04);tone(2200,s,.4,"sine",.02)})}
    else if(k==="goal"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.32,"triangle",.07))}
    else if(k==="pop"){tone(740,0,.07,"sine",.04);tone(990,.05,.09,"sine",.03)}

  }catch(e){}
}
